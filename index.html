<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B3FE4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="កាតសិស្ស">
<meta name="description" content="គ្រប់គ្រងបញ្ជីសិស្ស និងបង្កើតកាតសិស្សសម្រាប់បោះពុម្ព">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ប្រព័ន្ធគ្រប់គ្រងកាតសិស្ស</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Battambang&family=Bokor&family=Content&family=Dangrek&family=Fasthand&family=Freehand&family=Hanuman&family=Koulen&family=Metal&family=Moul&family=Moulpali&family=Nokora&family=Siemreap&family=Suwannaphum&display=swap">
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: Canva-style studio. Left rail nav + soft rounded workspace; mobile = bottom tab bar.
   Palette: violet (brand), teal (action accent), gold (Khmer card border). Display: Muol Light. Body: Siemreap. */
:root{
  --bg:#F3F1FB; --surface:#FFFFFF; --surface2:#F8F7FD; --line:#E4E0F4; --fg:#1E1B2E; --muted:#6B6785;
  --brand:#7B3FE4; --brand-ink:#FFFFFF; --brand-soft:#EFE7FD;
  --teal:#00A6B2; --teal-soft:#DDF6F7;
  --gold:#C9971C; --good:#14946B; --warn:#C77700; --bad:#D6334A; --bad-soft:#FDE8EB;
  --shadow:0 1px 2px rgba(40,24,90,.06),0 8px 24px rgba(40,24,90,.08);
  --f-display:"Khmer OS Muol Light","Moul",serif;
  --f-body:"Khmer OS Siemreap","Siemreap",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12101B; --surface:#1B1827; --surface2:#221F31; --line:#332E49; --fg:#F1EEFB; --muted:#A39EBE;
  --brand:#A27BFF; --brand-ink:#16102A; --brand-soft:#2C2250; --teal:#38D3DE; --teal-soft:#123A40;
  --gold:#E2B648; --good:#3FD1A1; --warn:#F0A63A; --bad:#FF7285; --bad-soft:#3F1B24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12101B; --surface:#1B1827; --surface2:#221F31; --line:#332E49; --fg:#F1EEFB; --muted:#A39EBE;
  --brand:#A27BFF; --brand-ink:#16102A; --brand-soft:#2C2250; --teal:#38D3DE; --teal-soft:#123A40;
  --gold:#E2B648; --good:#3FD1A1; --warn:#F0A63A; --bad:#FF7285; --bad-soft:#3F1B24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-block:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));min-height:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.6;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.sr{position:absolute;left:-9999px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  padding:9px 16px;border-radius:12px;font-weight:400;min-height:42px;transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--brand),#5B2FD0);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(123,63,228,.3)}
:root[data-theme="dark"] .btn.primary{color:#16102A;background:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#16102A;background:var(--brand)}}
.btn.teal{background:var(--teal);color:#fff;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.sure{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* inputs */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:13px;color:var(--muted)}
.in,select.in,textarea.in{width:100%;padding:10px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-soft)}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:linear-gradient(150deg,#6A2FD6 0%,#8B4DF0 45%,#00B3BE 120%);color:#fff;padding:48px max(32px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art h1{font-size:30px;max-width:14em}
.login-art p{max-width:30em;opacity:.92}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.25;background:#fff}
.login-art .mini{display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.mini .mc{width:96px;height:132px;border-radius:12px;background:#F2F5FF;border:3px double #C9971C;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:rotate(-6deg);display:flex;flex-direction:column;gap:6px;padding:10px}
.mini .mc:nth-child(2){transform:rotate(3deg) translateY(10px)}
.mini .mc:nth-child(3){transform:rotate(-2deg) translateY(-6px)}
.mc i{display:block;height:6px;border-radius:3px;background:#C9D3EE}
.mc b{display:block;width:34px;height:42px;border:2px solid #E4B73A;border-radius:4px;margin-top:auto;background:#fff}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px max(20px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.login-card h2{font-size:20px}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;min-height:20px}

/* shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh;min-height:100dvh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--teal));display:grid;place-items:center;color:#fff}
.brand b{font-family:var(--f-display);font-weight:400;font-size:13px;line-height:1.5}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:transparent;border-radius:12px;text-align:left;color:var(--muted)}
.nav button:hover{background:var(--surface2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.main{padding:28px clamp(16px,3vw,40px);min-width:0;padding-left:max(16px,calc(clamp(16px,3vw,40px)));}
.page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:22px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;min-width:0}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:1.3fr 1fr}
.stat{display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;color:#fff;min-width:0}
.stat .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.stat small{display:block;opacity:.92;font-size:13px}
.stat strong{font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}
.s1{background:linear-gradient(135deg,#7B3FE4,#9D6BFF)}
.s2{background:linear-gradient(135deg,#0097A7,#2CD3D9)}
.s3{background:linear-gradient(135deg,#E0457B,#FF8FB0)}
.s4{background:linear-gradient(135deg,#C9971C,#F3CB5B)}
.bar{display:grid;grid-template-columns:64px 1fr 36px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--teal))}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.ava{width:40px;height:50px;border-radius:8px;object-fit:cover;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);flex:none;overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.li:last-child{border:0}
.li div{min-width:0}
.li small{color:var(--muted);display:block}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12.5px;background:var(--brand-soft);color:var(--brand)}
.pill.f{background:#FDE7F0;color:#C02662}.pill.m{background:var(--teal-soft);color:#007985}
:root[data-theme="dark"] .pill.f{background:#43192E;color:#FF9DC2}
:root[data-theme="dark"] .pill.m{color:#6BE3EC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.f{background:#43192E;color:#FF9DC2}:root:not([data-theme="light"]) .pill.m{color:#6BE3EC}}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--teal-soft);border-radius:16px;padding:12px 16px;margin-bottom:18px}

/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:760px;background:var(--surface)}
th{font-family:var(--f-display);font-weight:400;font-size:12.5px;background:var(--surface2);text-align:left;padding:12px 14px;white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--surface2)}
td.act{white-space:nowrap;text-align:right}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;color:var(--muted)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(18,12,40,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:24px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(0,0,0,.35);padding:24px;margin-block:auto}
.modal h2{font-size:18px;margin-bottom:16px}
.form{display:grid;grid-template-columns:150px 1fr 1fr;gap:14px}
.form .ph{grid-row:span 4}
.form .w2{grid-column:span 2}
.photo{aspect-ratio:4/5;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;text-align:center;color:var(--muted);overflow:hidden;background:var(--surface2);width:100%}
.photo img{width:100%;height:100%;object-fit:cover}
.modal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}

/* cards workspace */
.cw{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.pick{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:14px}
.pick label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pick label:last-child{border:0}
.seg{display:grid;gap:8px}
.seg label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.seg label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.stage{background:repeating-conic-gradient(var(--surface2) 0 25%,var(--bg) 0 50%) 0 0/20px 20px;border-radius:20px;padding:20px;overflow:auto;border:1px solid var(--line)}
.sheet{display:grid;grid-template-columns:repeat(2,90mm);gap:4mm;justify-content:center;zoom:.82}

/* ID card (fixed print palette, independent of theme) */
.card{-webkit-print-color-adjust:exact;print-color-adjust:exact;--c-bg:#F1F5FD;--c-ink:#1B2A5E;--c-text:#111;--c-gold:#C79A1B;--c-red:#C8102E;
  width:90mm;height:127mm;background:var(--c-bg);color:var(--c-text);border:1.1mm solid var(--c-gold);border-radius:2mm;position:relative;
  padding:3mm 4mm;display:flex;flex-direction:column;overflow:hidden;font-family:var(--f-body);break-inside:avoid;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.card::before,.card::after{content:"";position:absolute;width:9mm;height:9mm;border:0.6mm solid var(--c-gold);pointer-events:none}
.card::before{left:1mm;top:1mm;border-right:0;border-bottom:0;border-radius:3mm 0 0 0}
.card::after{right:1mm;bottom:1mm;border-left:0;border-top:0;border-radius:0 0 3mm 0}
.wm{position:absolute;inset:34mm 10mm 30mm;display:grid;place-items:center;opacity:.09;pointer-events:none}
.wm img{max-width:100%;max-height:100%}
.c-top{text-align:center}
.c-king{font-family:var(--f-display);font-size:3.9mm;color:var(--c-ink);line-height:1.7}
.c-nation{font-family:var(--f-display);font-size:3.3mm;color:var(--c-ink);line-height:1.7}
.c-rule{height:.35mm;background:linear-gradient(90deg,transparent,var(--c-red),transparent);margin:.8mm 8mm}
.c-orgt{flex:1;text-align:center;font-size:3mm;color:var(--c-ink);line-height:1.6}
.c-title{font-family:var(--f-display);font-size:4.8mm;text-align:center;color:var(--c-ink);margin:1.4mm 0 1mm;border-top:.5mm solid var(--c-gold);padding-top:1.2mm}
.c-body{display:flex;flex-direction:column;gap:.2mm;position:relative}
.c-row{display:flex;justify-content:space-between;gap:2mm;font-size:3.2mm;line-height:1.7;white-space:nowrap}
.c-row span{overflow:hidden;text-overflow:ellipsis}
.c-row .grow{flex:1}


.c-org{margin-top:1.5mm;padding-left:17mm;min-height:15mm;display:flex;align-items:center;justify-content:center}
.c-top,.c-title,.c-body{position:relative;z-index:1}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:0;-webkit-user-drag:none}
.el{position:absolute;box-sizing:border-box;z-index:2}
.el img{-webkit-user-drag:none;user-select:none}
.el.logo{display:grid;place-items:center;font-size:2.2mm;color:#8A95B5;text-align:center}
.el.logo.ph{border:.4mm dashed #9AA6C8;border-radius:50%}
.el.logo img{width:100%;height:100%;object-fit:contain}
.el.photo{border:.8mm solid #F2B705;background:#fff;display:grid;place-items:center;overflow:hidden;color:#A9B3CC;font-size:2.4mm}
.el.photo img{width:100%;height:100%;object-fit:cover}
.el.school{text-align:center}
.el.school .sch{font-family:var(--f-display);font-size:calc(2.9mm*var(--k,1));color:var(--c-red);line-height:1.65}
.el.school .yr{font-size:calc(3.1mm*var(--k,1));color:var(--c-ink);line-height:1.65}
.el.sign{text-align:center;font-size:calc(2.6mm*var(--k,1));line-height:1.65}
.el.sign .sg{font-family:var(--f-display);margin-top:1.5mm}
.el.stamp img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.el.stamp.ph{border:.4mm dashed #E0457B;color:#E0457B;display:grid;place-items:center;font-size:3mm}
.rz{display:none;position:absolute;right:0;bottom:0;width:3.4mm;height:3.4mm;background:#E0457B;border-radius:50%;cursor:nwse-resize;z-index:5}
.edm .el{cursor:move;outline:.35mm dashed #00A6B2;touch-action:none}
.edm .el.on{outline:.5mm solid #E0457B}
.edm .el.on .rz{display:block}
.sheet.big{zoom:1.35}
.ed-note{font-size:13px;color:var(--muted)}

.el.head{text-align:center}
.el .c-king{font-size:calc(3.9mm*var(--k,1));line-height:1.7}
.el .c-nation{font-size:calc(3.3mm*var(--k,1));line-height:1.7}
.el.dept{text-align:center;font-size:calc(3mm*var(--k,1));color:var(--c-ink);line-height:1.6}
.el.title{font-family:var(--f-display);font-size:calc(4.8mm*var(--k,1));text-align:center;color:var(--c-ink);border-top:.5mm solid var(--c-gold);padding-top:1mm;line-height:1.6}
.el.txt{font-size:calc(3.2mm*var(--k,1));line-height:1.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swatch{width:48px;height:40px;padding:0;border:1.5px solid var(--line);border-radius:10px;background:none;cursor:pointer}
.dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;padding:0}
.bgth{width:44px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.card.nob{border-color:transparent}
.card.nob::before,.card.nob::after{display:none}
.el.frame{z-index:1;pointer-events:none}
.edm .el.frame{pointer-events:auto}
.el.frame img{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}
.ffs,.ffs *{font-family:inherit!important}
.fcs,.fcs *{color:inherit!important}
.fws,.fws *{font-weight:700!important}
/* misc */
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:90;box-shadow:var(--shadow)}
.tabs{display:none}
.sect{display:grid;gap:14px;margin-bottom:20px}
.sect h2{font-size:15px}

@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}.cw{grid-template-columns:1fr}
}
@media (max-width:760px){
  .login{grid-template-columns:1fr}.login-art{padding-block:28px}.login-art .mini{display:none}
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:40}
  .brand,.rail-foot .txt{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around}
  .nav button{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 8px;line-height:1.4}
  .rail-foot{margin:0;flex-direction:row}
  .main{padding-bottom:96px}
  .form{grid-template-columns:1fr 1fr}.form .ph{grid-row:auto;grid-column:span 2;max-width:150px}
  .sheet{zoom:.6}
}
@media (max-width:420px){.g4{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .w2,.form .ph{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* phone: student rows become cards, one id card per row */
@media (max-width:760px){
  .tw{border:0;overflow:visible;background:none}
  table{min-width:0;background:none}
  thead{display:none}
  tbody{display:grid;gap:10px}
  tbody tr{display:grid;grid-template-columns:auto auto auto 1fr auto;grid-template-areas:"ph name name name act" "ph no cls sex act" "ph dob dob dob act";gap:2px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
  tbody tr:hover{background:var(--surface)}
  td{border:0;padding:0}
  td.c-ph{grid-area:ph}td.c-name{grid-area:name;font-weight:700}td.c-no{grid-area:no;color:var(--muted)}

  const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{

    im.onerror=()=>res("");im.src=fr.result};fr.onerror=()=>res("");fr.readAsDataURL(file)})}

function xlTemplate(){saveBlob(makeXlsx([XL_H,["","124","សាហ៊ាវ កក្កដា","ស្រី","១១/សីហា/២០១៥","ស្វាយចេក",'៨"B"',"ចាន បុផ្ផា","ស ស"]]),"students_template.xlsx")}
function xlExport(){saveBlob(makeXlsx([XL_H].concat(S.students.map(s=>["",s.no,s.name,s.sex,s.dob,s.addr,s.cls,s.father,s.mother]))),"students.xlsx")}
async function importFile(file){
  const n=file.name.toLowerCase();let rows;
  try{
    if(n.endsWith(".csv"))rows=parseCSV(await file.text());
    else if(n.endsWith(".xlsx"))rows=await readXlsx(await file.arrayBuffer());
    else{toast("សូមរក្សាទុកឯកសារជា .xlsx ឬ .csv");return}
  }catch(e){toast("មិនអាចអានឯកសារបានទេ សូមពិនិត្យថាជា .xlsx");return}
  const r=importRows(rows);saveStudents();go(S.view,true);
  toast(`បន្ថែម ${kh(r.add)} · កែ ${kh(r.upd)} · រំលង ${kh(r.skip)}`);
}

/* ---------- backup / restore (move data between phone and computer) ---------- */
function backupFile(){
  const cf=Object.assign({},S.cfg);delete cf.user;delete cf.pass;
  return new File([JSON.stringify({app:"cms",v:2,saved:new Date().toISOString(),students:S.students,cfg:cf})],"student-cards-backup-"+new Date().toISOString().slice(0,10)+".json",{type:"application/json"});
}
async function doBackup(share){
  const f=backupFile();
  if(share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"បម្រុងទុកកាតសិស្ស"});return}catch(e){if(e&&e.name==="AbortError")return}}
  saveBlob(f,f.name);toast("បានបម្រុងទុក");
}
async function doRestore(file){
  let o;try{o=JSON.parse(await file.text())}catch(e){toast("ឯកសារបម្រុងទុកមិនត្រឹមត្រូវ");return}
  if(!o||o.app!=="cms"||!Array.isArray(o.students)){toast("ឯកសារបម្រុងទុកមិនត្រឹមត្រូវ");return}
  const cred={user:S.cfg.user,pass:S.cfg.pass};
  S.students=o.students;S.cfg=Object.assign({},DEF,o.cfg||{},cred);initLay();saveStudents();saveCfg();
  toast("បានស្ដារទិន្នន័យ "+kh(S.students.length)+" នាក់");go("settings",true);
}
function backupSection(){
  return `<section class="panel sect"><h2>បម្រុងទុក និងផ្ទេរទិន្នន័យ</h2>
    <div class="row">${LOCAL?`<button class="btn" data-act="bak">${ic("down")}បម្រុងទុក (.json)</button>`:""}${LOCAL&&navigator.share?`<button class="btn" data-act="bakshare">${ic("up")}ផ្ញើ…</button>`:""}
      <label class="btn" for="rst" style="cursor:pointer">${ic("up")}ស្ដារពីឯកសារបម្រុងទុក</label><input type="file" id="rst" accept=".json,application/json" class="sr"></div>
    <div class="hint">ទិន្នន័យរក្សាទុកក្នុងឧបករណ៍នីមួយៗ។ ដើម្បីផ្ទេរពីទូរសព្ទទៅកុំព្យូទ័រ (ឬបញ្ច្រាស) សូមបម្រុងទុក រួចផ្ញើឯកសារតាម Telegram ឬ USB ហើយ “ស្ដារ” នៅម៉ាស៊ីនថ្មី។ ការស្ដារជំនួសទិន្នន័យបច្ចុប្បន្ន។ ឯកសារបម្រុងទុកមានរូបថត និងការរចនាកាត ប៉ុន្តែមិនមានពាក្យសម្ងាត់ទេ។</div></section>`;
}

/* ---------- install as an app ---------- */
let deferredInstall=null;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(S.authed&&S.view==="settings")go("settings",true)});
addEventListener("appinstalled",()=>{deferredInstall=null;toast("បានដំឡើងកម្មវិធីរួចរាល់");if(S.authed&&S.view==="settings")go("settings",true)});
if("serviceWorker" in navigator&&LOCAL&&/^https?:$/.test(location.protocol)){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
function appSection(){
  const web=LOCAL&&/^https?:$/.test(location.protocol);let body;
  if(standalone())body='<div class="hint">កំពុងប្រើជាកម្មវិធីដែលបានដំឡើង។ ដំណើរការបានដោយគ្មានអ៊ីនធឺណិត។</div>';
  else if(!web)body='<div class="hint">ដើម្បីដំឡើងជាកម្មវិធី សូមដាក់ឯកសារទាំងនេះលើគេហទំព័រ (HTTPS) រួចបើកតំណនោះ។ មើលការណែនាំក្នុង README។</div>';
  else if(deferredInstall)body=`<button class="btn primary" data-act="install">${ic("down")}ដំឡើងកម្មវិធី</button>`;
  else body='<div class="hint">Android និងកុំព្យូទ័រ (Chrome, Edge)៖ ចុចម៉ឺនុយ ⋮ ➜ “Install app” ឬ “Add to Home screen”។<br>iPhone / iPad (Safari)៖ ចុច Share ➜ “Add to Home Screen”។</div>';
  return `<section class="panel sect"><h2>កម្មវិធីលើទូរសព្ទ / កុំព្យូទ័រ</h2>${body}</section>`;
}

/* ---------- start ---------- */
async function boot(){
  try{
    const load=(async()=>{
      let st=await DB.get("students"),cf=await DB.get("cfg");
      if(st==null&&cf==null){
        const ls=LS.get("cms.students",null),lc=LS.get("cms.cfg",null);
        if(ls||lc){st=ls;cf=lc;if(st)await DB.set("students",st);if(cf)await DB.set("cfg",cf)}
      }
      if(st)S.students=st;
      if(cf){S.cfg=Object.assign({},DEF,cf);initLay()}
    })();
    await Promise.race([load,new Promise(r=>setTimeout(r,3500))]);
  }catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  go(S.view);
}

/* ---------- router ---------- */
function go(v,keep){
  S.view=v;try{history.replaceState(null,"","#"+v)}catch(e){}
  if(!S.authed){$("#root").innerHTML=loginView();return}
  $("#root").innerHTML=shell();const m=$("#main");
  m.innerHTML=({dashboard,students:studentsView,cards:cardsView,settings:settingsView})[v]();
  if(v==="students")drawList();if(v==="cards"){drawCards();drawEditPanel()}
  if(!keep)window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener("submit",e=>{
  if(e.target.id==="lf"){e.preventDefault();
    if($("#lu").value===S.cfg.user&&$("#lp").value===S.cfg.pass){S.authed=true;try{sessionStorage.setItem("cms.auth","1")}catch(x){}go(S.view)}
    else{$("#le").textContent="អ្នកប្រើ ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ";$("#lp").value=""}}
  if(e.target.id==="sf")submitForm(e);
});
document.addEventListener("click",e=>{
  if(e.target.id==="scrim"){closeForm();return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="nav")go(b.dataset.v);
  else if(a==="theme"){setTheme(isDark()?"light":"dark");go(S.view)}
  else if(a==="logout"){S.authed=false;try{sessionStorage.removeItem("cms.auth")}catch(x){}go(S.view)}
  else if(a==="add")openForm();
  else if(a==="edit")openForm(id);
  else if(a==="close")closeForm();
  else if(a==="nophoto"){formPhoto="";$("#pv").textContent="រូបថត ៤×៦"}
  else if(a==="del"){
    if(!b.classList.contains("sure")){b.classList.add("sure");b.lastChild.textContent="ចុចម្តងទៀតដើម្បីបញ្ជាក់";return}
    S.students=S.students.filter(s=>s.id!==id);saveStudents();closeForm();toast("លុបបានជោគជ័យ");go(S.view)}
  else if(a==="pg"){S.page+=+b.dataset.d;drawList()}
  else if(a==="clrdemo"){S.students=S.students.filter(s=>!s.demo);saveStudents();go(S.view)}
  else if(a==="selall"){S.students.forEach(s=>S.sel.add(s.id));go("cards")}
  else if(a==="selnone"){S.sel.clear();go("cards")}
  else if(a==="print"){if(S.edit){S.edit=false;go("cards",true)}window.print()}
  else if(a==="layedit"){S.edit=!S.edit;go("cards",true)}
  else if(a==="bgpre"){S.cfg.bgc=b.dataset.c;saveCfg();go(S.view,true)}
  else if(a==="selel"){S.selEl=b.dataset.k;drawEditPanel();drawCards()}
  else if(a==="rlay"){S.cfg.lay[S.selEl]=Object.assign({},DEFLAY[S.selEl]);saveCfg();drawEditPanel();drawCards()}
  else if(a==="nobg"){S.cfg.bg="";saveCfg();go(S.view,true)}
  else if(a==="noframe"){S.cfg.frame="";saveCfg();go(S.view,true)}
  else if(a==="fcreset"){S.cfg.lay[S.selEl].fc="";saveCfg();drawEditPanel();drawCards()}
  else if(a==="ffall"){const f=S.cfg.lay[S.selEl].ff||"";Object.keys(S.cfg.lay).forEach(k=>{if(!NOFS.includes(k))S.cfg.lay[k].ff=f});saveCfg();drawCards();toast("បានប្រើ Font នេះលើអក្សរទាំងអស់")}
  else if(a==="nostamp"){S.cfg.stamp="";saveCfg();go(S.view,true)}
  else if(a==="xltpl")xlTemplate();
  else if(a==="xlexp")xlExport();
  else if(a==="bak")doBackup(false);
  else if(a==="bakshare")doBackup(true);
  else if(a==="install"&&deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null})}
  else if(a==="savecfg"){saveCfg();toast("រក្សាទុកការកំណត់រួចរាល់")}
  else if(a==="nologo"){S.cfg.logo="";saveCfg();go(S.view,true)}
  else if(a==="copycsv"){const t=toCSV();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("បានចម្លង CSV"),()=>toast("មិនអាចចម្លងបាន"))}
  else if(a==="dlcsv"){const u=URL.createObjectURL(new Blob([toCSV()],{type:"text/csv;charset=utf-8"}));const l=document.createElement("a");l.href=u;l.download="students.csv";l.click();URL.revokeObjectURL(u)}
  else if(a==="wipe"){
    if(!b.classList.contains("sure")){b.classList.add("sure");b.lastChild.textContent="ចុចម្តងទៀតដើម្បីលុបទាំងអស់";return}
    S.students=[];saveStudents();toast("បានលុបទិន្នន័យ");go("settings")}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.value;return}
  if(t.dataset.lay){S.cfg.lay[S.selEl][t.dataset.lay]=parseFloat(t.value)||0;saveCfg();drawCards();return}
  if(t.dataset.lays){const k=t.dataset.lays;S.cfg.lay[S.selEl][k]=t.type==="checkbox"?t.checked:t.value;saveCfg();drawCards();return}
  const k=t.dataset.in;if(!k)return;
  if(k==="q"){S.q=t.value;S.page=1;drawList()}
  else if(k==="fc"){S.fc=t.value;S.page=1;drawList()}
  else if(k==="fs"){S.fs=t.value;S.page=1;drawList()}
  else if(k==="scope"){S.scope=t.value;go("cards")}
  else if(k==="scls"){S.scls=t.value;drawCards()}
  else if(k==="bgc"){S.cfg.bgc=t.value;const x=$("#bgx");if(x)x.value=t.value;saveCfg();drawCards()}
  else if(k==="bgx"){if(/^#[0-9a-f]{6}$/i.test(t.value)){S.cfg.bgc=t.value;const c=$("#bgc");if(c)c.value=t.value;saveCfg();drawCards()}}
  else if(k==="hideb"){S.cfg.hideBorder=t.checked;saveCfg();drawCards()}
  else if(k==="bgfit"){S.cfg.bgfit=t.value;saveCfg();drawCards()}
  else if(k==="selel"){S.selEl=t.value;drawEditPanel();drawCards()}
  else if(k==="bgop"){S.cfg.bgop=+t.value;const v=$("#bgv");if(v)v.textContent=t.value;saveCfg();drawCards()}
  else if(k==="pick"){t.checked?S.sel.add(t.value):S.sel.delete(t.value);drawCards()}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="pf"&&t.files[0]){formPhoto=await readPhoto(t.files[0]);$("#pv").innerHTML=formPhoto?`<img src="${formPhoto}" alt="">`:"មិនអាចបើករូបបាន"}
  if(t.dataset.up&&t.files[0]){
    const k=t.dataset.up,f=t.files[0];
    if(k==="logo")S.cfg.logo=await procImg(f,{max:260,png:true});
    else if(k==="frame")S.cfg.frame=await procImg(f,{max:1100,png:true});
    else if(k==="stamp")S.cfg.stamp=await procImg(f,{max:360,png:true,clean:true});
    else if(k==="bg"){S.cfg.bg=await procImg(f,{max:900});S.cfg.bgop=100}
    saveCfg();t.value="";go(S.view,true);return}
  if(t.id==="rst"&&t.files[0]){await doRestore(t.files[0]);t.value="";return}
  if((t.id==="xl"||t.id==="imp")&&t.files[0]){await importFile(t.files[0]);t.value="";return}
  if(t.id==="phs"&&t.files.length){
    const tot=t.files.length;let n=0;for(const f of t.files){const base=f.name.replace(/\.[^.]+$/,"").trim(),st=S.students.find(x=>x.no===base);
      if(st){const d=await readPhoto(f);if(d){st.photo=d;st.demo=false;n++}}}
    saveStudents();t.value="";go(S.view,true);toast("ភ្ជាប់រូបថត "+kh(n)+" / "+kh(tot));return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#scrim"))closeForm()});

boot();
</script>
